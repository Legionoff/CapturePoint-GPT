name: Build Capture Point
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile Capture Point for Minecraft 26.3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: Prepare tracked source files
        shell: bash
        run: |
          set -euo pipefail
          test -f src/main/java/com/capturepoint/core/CapturePointManager.java
          test -f src/main/java/com/capturepoint/command/CapturePointCommands.java
          test -f src/client/java/com/capturepoint/client/CapturePointAdminScreen.java
          sed -i 's/\\bmodImplementation\\b/implementation/g' build.gradle
          sed -i 's/minecraft\\.setScreen(/minecraft.gui.setScreen(/g' src/client/java/com/capturepoint/client/CapturePointAdminScreen.java
          sed -i 's/displayClientMessage(\\(.*\\), true);/sendOverlayMessage(\\1);/' src/client/java/com/capturepoint/client/CapturePointClient.java

      - name: Commit restored source files to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src build.gradle gradle.properties settings.gradle
          if ! git diff --cached --quiet; then
            git commit -m "Restore actual Capture Point source files [skip ci]"
            git push
          fi

      - name: Build mod
        run: gradle --no-daemon clean build

      - name: Upload JAR and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CapturePoint-build-${{ github.run_number }}
          path: |
            build/libs/*.jar
            build/reports/**
          if-no-files-found: warn
          retention-days: 14
