name: Build Capture Point
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: gradle --no-daemon build
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: CapturePoint-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
