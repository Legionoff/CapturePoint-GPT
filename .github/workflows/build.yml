name: Build Capture Point
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile Capture Point for Minecraft 26.3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: Extract canonical source archive
        shell: bash
        run: |
          set -euo pipefail
          unzip -q CapturePoint-0.1.2-GitHub-Import.zip -d /tmp/capturepoint-import
          test -f /tmp/capturepoint-import/CapturePoint/src/main/java/com/capturepoint/core/CapturePointManager.java
          rm -rf src
          cp -a /tmp/capturepoint-import/CapturePoint/src ./src
          cp /tmp/capturepoint-import/CapturePoint/build.gradle ./build.gradle
          cp /tmp/capturepoint-import/CapturePoint/gradle.properties ./gradle.properties
          cp /tmp/capturepoint-import/CapturePoint/settings.gradle ./settings.gradle
          # Minecraft 26.1+ uses unobfuscated Loom: mod dependencies use implementation.
          sed -i 's/\bmodImplementation\b/implementation/g' build.gradle
          echo "Source files restored:"
          wc -c src/main/java/com/capturepoint/*.java src/main/java/com/capturepoint/command/*.java src/main/java/com/capturepoint/core/*.java

      - name: Commit restored source files to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src build.gradle gradle.properties settings.gradle
          if ! git diff --cached --quiet; then
            git commit -m "Restore actual Capture Point source files [skip ci]"
            git push
          fi

      - name: Build mod
        run: gradle --no-daemon clean build

      - name: Upload JAR and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CapturePoint-build-${{ github.run_number }}
          path: |
            build/libs/*.jar
            build/reports/**
          if-no-files-found: warn
          retention-days: 14
